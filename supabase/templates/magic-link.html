<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Resolution Circle sign-in link</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0f0a2e; font-family:Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0f0a2e; padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px; background-color:#1a1440; border-radius:16px; padding:32px;">
            <tr>
              <td align="center" style="padding-bottom:16px;">
                <span style="font-size:24px; font-weight:bold; color:#ffffff;">Resolution Circle</span>
              </td>
            </tr>
            <tr>
              <td style="color:#c9c3f0; font-size:16px; line-height:24px; text-align:center; padding-bottom:24px;">
                Click the button below to sign in. This link expires in 1 hour and can only be used once.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block; background-color:#9333ea; color:#ffffff; text-decoration:none; font-size:16px; font-weight:bold; padding:12px 32px; border-radius:8px;"
                >
                  Sign in to Resolution Circle
                </a>
              </td>
            </tr>
            <tr>
              <td style="color:#8f88b8; font-size:13px; line-height:20px; text-align:center;">
                If you didn't request this link, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
